replicaCount: 1

image:
  # Local image built for Docker Desktop; no registry prefix.
  repository: tic-tac-toe
  tag: local
  # Never pull — use the locally built image.
  pullPolicy: IfNotPresent

# Port the app listens on inside the container.
containerPort: 8000

service:
  type: ClusterIP
  port: 8000

# Readiness/liveness probes against the service's /health endpoint.
probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20

# Resource requests/limits intentionally left unset in v1.
resources: {}
