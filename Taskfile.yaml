version: "3"

# Local mirror of .github/workflows/ci.yaml so `task ci` reproduces CI.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies (mirrors CI "Install dependencies")
    cmds:
      - poetry install --no-interaction

  # --- lint job (mirrors CI job: lint) ---
  ruff-check:
    desc: ruff check
    cmds:
      - poetry run ruff check .

  ruff-format-check:
    desc: ruff format --check
    cmds:
      - poetry run ruff format --check .

  mypy:
    desc: mypy
    cmds:
      - poetry run mypy app

  lint:
    desc: "CI lint job: ruff check, ruff format --check, mypy"
    cmds:
      - task: ruff-check
      - task: ruff-format-check
      - task: mypy

  # --- test job (mirrors CI job: test) ---
  test:
    desc: "CI test job: pytest, tolerating exit code 5 (no tests collected)"
    cmds:
      - |
        code=0
        poetry run pytest || code=$?
        if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
          exit 0
        fi
        exit "$code"

  # --- helm job (mirrors CI job: helm) ---
  helm-lint:
    desc: "CI helm job: lint the chart"
    cmds:
      - helm lint helm/tic-tac-toe

  # --- docker / platform ---
  docker-build:
    desc: Build the local Docker image (tic-tac-toe:local)
    cmds:
      - docker build -t tic-tac-toe:local .

  docker-smoke:
    desc: Build the image, run it, curl /health, then stop and remove (cleanup via trap)
    deps: [docker-build]
    cmds:
      - |
        set -e
        name=ttt-smoke
        cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        docker run -d --name "$name" -p 8001:8000 tic-tac-toe:local >/dev/null
        for _ in $(seq 1 20); do
          curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1 && break
          sleep 0.5
        done
        echo "health: $(curl -sf http://127.0.0.1:8001/health)"

  platform-check:
    desc: Smoke-test the container and lint the Helm chart (docker-smoke + helm lint)
    cmds:
      - task: docker-smoke
      - task: helm-lint

  # --- full pipeline (all CI jobs) ---
  ci:
    desc: Run the full CI pipeline locally (lint + test + helm-lint)
    cmds:
      - task: lint
      - task: test
      - task: helm-lint
